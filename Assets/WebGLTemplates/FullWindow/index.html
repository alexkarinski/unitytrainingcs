<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; }
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
              align-items: center; justify-content: center; color: #ccc; font: 16px system-ui, sans-serif; }
    #bar { width: 260px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #4caf50; }
    #cfg { position: absolute; top: 10px; right: 10px; padding: 7px 12px; border: 0; border-radius: 6px;
           background: #2e7d32; color: #fff; font: 14px system-ui, sans-serif; cursor: pointer; display: none; }
    body.unlocked #cfg { display: block; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <button id="cfg" title="autoexec.cfg, config.cfg, cs2_user_convars_0_slot0.vcfg, cs2_user_keys_0_slot0.vcfg…">Загрузить конфиг CS2</button>
  <input id="cfg-files" type="file" accept=".cfg,.vcfg,.txt" multiple hidden>
  <div id="loader">
    <div>CS Aim Trainer: загрузка…</div>
    <div id="bar"><div id="fill"></div></div>
    <div style="font-size:13px;color:#888">Кликни по игре, чтобы захватить мышь. Esc открывает меню.</div>
  </div>
  <script>
    // Raw mouse: ask the browser for pointer-lock deltas WITHOUT OS acceleration, so mouse
    // counts map 1:1 like CS2's raw input. Falls back if the browser doesn't support it.
    (function () {
      var original = HTMLCanvasElement.prototype.requestPointerLock;
      HTMLCanvasElement.prototype.requestPointerLock = function (options) {
        var self = this;
        try {
          var r = original.call(self, Object.assign({ unadjustedMovement: true }, options || {}));
          if (r && typeof r.catch === "function") return r.catch(function () { return original.call(self, options); });
          return r;
        } catch (e) {
          return original.call(self, options);
        }
      };
    })();
  </script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, function (progress) {
      document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
    }).then(function (unity) {
      document.querySelector("#loader").remove();
      wireConfigUpload(unity);
    }).catch(function (e) {
      document.querySelector("#loader").textContent = "Ошибка загрузки: " + e;
    });

    // The config button is only shown while the mouse is free (menu open), like any page UI.
    function syncLock() { document.body.classList.toggle("unlocked", !document.pointerLockElement); }
    document.addEventListener("pointerlockchange", syncLock);
    syncLock();

    // Read the chosen CS2 config files in the browser and hand their text to the game. Files are
    // applied in the same order the game would: stock defaults first, autoexec last.
    function priority(name) {
      var n = name.toLowerCase();
      if (n.indexOf("default") >= 0) return 0;
      if (n.indexOf("cs2_machine_convars") === 0) return 1;
      if (n.indexOf("cs2_user_") === 0) return 2;
      if (n === "config.cfg") return 3;
      if (n === "autoexec.cfg") return 5;
      return 4;
    }
    function wireConfigUpload(unity) {
      var input = document.querySelector("#cfg-files");
      document.querySelector("#cfg").addEventListener("click", function () { input.click(); });
      input.addEventListener("change", function () {
        var files = Array.prototype.slice.call(input.files)
          .filter(function (f) { return f.name.toLowerCase().indexOf("gamemode_") !== 0; })
          .sort(function (a, b) { return priority(a.name) - priority(b.name); });
        Promise.all(files.map(function (f) { return f.text(); })).then(function (texts) {
          texts.forEach(function (t) { unity.SendMessage("HUD", "LoadConfigText", t); });
          input.value = "";
        });
      });
    }
  </script>
</body>
</html>
