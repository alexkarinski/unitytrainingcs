<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; }
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
              align-items: center; justify-content: center; color: #ccc; font: 16px system-ui, sans-serif; }
    #bar { width: 260px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #4caf50; }
    #cfg { position: absolute; bottom: 10px; right: 10px; padding: 7px 12px; border: 0; border-radius: 6px;
           background: #2e7d32; color: #fff; font: 14px system-ui, sans-serif; cursor: pointer; display: none; }
    body.unlocked #cfg { display: block; }
    #mdl { position: absolute; bottom: 10px; right: 200px; padding: 7px 12px; border: 0; border-radius: 6px;
           background: #455a64; color: #fff; font: 14px system-ui, sans-serif; cursor: pointer; display: none; }
    body.unlocked #mdl { display: block; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <button id="cfg" title="autoexec.cfg, config.cfg, cs2_user_convars_0_slot0.vcfg, cs2_user_keys_0_slot0.vcfg…">Загрузить конфиг CS2</button>
  <input id="cfg-files" type="file" accept=".cfg,.vcfg,.txt" multiple hidden>
  <button id="mdl" title="Модель для текущего оружия: .glb, экспортированный из твоей CS2 через Source 2 Viewer. Остаётся только в этом браузере.">Загрузить модель оружия</button>
  <input id="mdl-file" type="file" accept=".glb" hidden>
  <div id="loader">
    <div>CS Aim Trainer: загрузка…</div>
    <div id="bar"><div id="fill"></div></div>
    <div style="font-size:13px;color:#888">Нажми «Resume», чтобы захватить мышь. Esc открывает меню.</div>
  </div>
  <script>
    // Mouse capture, done the way an aim trainer needs it:
    //  1. Raw input: request pointer lock with unadjustedMovement, so deltas are mouse counts without
    //     OS acceleration, like CS2's raw input (falls back if the browser doesn't support it).
    //  2. No re-locking: Unity asks for the lock again on every click even while it's held. Chrome
    //     then re-locks and each time sends a bogus move (the cursor position reported as movement,
    //     e.g. dx=-640 dy=-698) that spins the view. While locked, those requests are ignored.
    //  3. Settle window: on a real lock, moves for a short moment are swallowed before Unity's
    //     listeners see them. The bogus move can arrive before pointerlockchange fires, so the
    //     window starts at the request and again at the unlocked->locked transition. Outside the
    //     window, a move whose delta is exactly minus the cursor position is dropped as well.
    (function () {
      var settleUntil = 0, wasLocked = false;
      function arm(ms) { settleUntil = Math.max(settleUntil, performance.now() + ms); }

      var original = HTMLCanvasElement.prototype.requestPointerLock;
      HTMLCanvasElement.prototype.requestPointerLock = function (options) {
        if (document.pointerLockElement === this) return Promise.resolve();
        var self = this;
        arm(400);
        try {
          var r = original.call(self, Object.assign({ unadjustedMovement: true }, options || {}));
          if (r && typeof r.catch === "function") return r.catch(function () { return original.call(self, options); });
          return r;
        } catch (e) {
          return original.call(self, options);
        }
      };

      function filter(e) {
        var locked = !!document.pointerLockElement;
        if (locked && !wasLocked) arm(150);
        wasLocked = locked;
        if (!locked) return;
        // Signature of the bogus move: movement equal to minus the (frozen) cursor position.
        var bogus = (e.movementX !== 0 || e.movementY !== 0) && e.movementX === -e.clientX && e.movementY === -e.clientY;
        if (bogus || performance.now() < settleUntil) e.stopImmediatePropagation();
      }
      window.addEventListener("mousemove", filter, true);
      window.addEventListener("pointermove", filter, true);
      document.addEventListener("pointerlockchange", function () {
        var locked = !!document.pointerLockElement;
        if (locked && !wasLocked) arm(150);
        wasLocked = locked;
      }, true);
    })();
  </script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, function (progress) {
      document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
    }).then(function (unity) {
      document.querySelector("#loader").remove();
      unityInstance = unity;
      wireConfigUpload(unity);
      wireModelUpload(unity);
    }).catch(function (e) {
      document.querySelector("#loader").textContent = "Ошибка загрузки: " + e;
    });

    // The config button is only shown while the mouse is free (menu open), like any page UI.
    var unityInstance = null;
    function syncLock() {
      var unlocked = !document.pointerLockElement;
      document.body.classList.toggle("unlocked", unlocked);
      // Esc is consumed by the browser to release the mouse; tell the game to show its menu.
      if (unityInstance) unityInstance.SendMessage("HUD", unlocked ? "OnPointerUnlocked" : "OnPointerLocked", "");
    }
    document.addEventListener("pointerlockchange", syncLock);
    syncLock();

    // Read the chosen CS2 config files in the browser and hand their text to the game. Files are
    // applied in the same order the game would: stock defaults first, autoexec last.
    function priority(name) {
      var n = name.toLowerCase();
      if (n.indexOf("default") >= 0) return 0;
      if (n.indexOf("cs2_machine_convars") === 0) return 1;
      if (n.indexOf("cs2_user_") === 0) return 2;
      if (n === "config.cfg") return 3;
      if (n === "autoexec.cfg") return 5;
      return 4;
    }
    // A .glb weapon model from the player's own disk, for the weapon currently in hand. It is
    // read locally and handed to the game; nothing is uploaded to any server.
    function wireModelUpload(unity) {
      var input = document.querySelector("#mdl-file");
      document.querySelector("#mdl").addEventListener("click", function () { input.click(); });
      input.addEventListener("change", function () {
        var f = input.files[0];
        if (!f) return;
        f.arrayBuffer().then(function (buf) {
          var bytes = new Uint8Array(buf), chunk = 0x8000, parts = [];
          for (var i = 0; i < bytes.length; i += chunk)
            parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)));
          unity.SendMessage("HUD", "LoadModelBase64", btoa(parts.join("")));
          input.value = "";
        });
      });
    }

    function wireConfigUpload(unity) {
      var input = document.querySelector("#cfg-files");
      document.querySelector("#cfg").addEventListener("click", function () { input.click(); });
      input.addEventListener("change", function () {
        var files = Array.prototype.slice.call(input.files)
          .filter(function (f) { return f.name.toLowerCase().indexOf("gamemode_") !== 0; })
          .sort(function (a, b) { return priority(a.name) - priority(b.name); });
        Promise.all(files.map(function (f) { return f.text(); })).then(function (texts) {
          texts.forEach(function (t) { unity.SendMessage("HUD", "LoadConfigText", t); });
          input.value = "";
        });
      });
    }
  </script>
</body>
</html>
